name: europa-museum
type: craftcms
docroot: web
php_version: "8.5"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: postgres
    version: "17"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
corepack_enable: false

nodejs_version: "24"
web_extra_exposed_ports:
  - name: browsersync
    container_port: 3000
    http_port: 2999
    https_port: 3000
